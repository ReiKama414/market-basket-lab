<html lang="zh-Hant">

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="純瀏覽器端購物籃關聯分析工作室。實作 Apriori 與 FP-Growth 演算法，支援 Web Worker 多執行緒運算、ECharts 多維統計圖表、Cytoscape.js 網絡拓樸與購物車推薦模擬。" />
    <title>Market Basket Lab | 純前端購物籃關聯分析工作室</title>
    <script>
      // Apply saved/system theme before first paint to avoid a light-mode flash in dark mode.
      (function () {
        try {
          var saved = localStorage.getItem('market_basket_theme');
          var dark = saved === 'dark' || ((saved !== 'light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.classList.toggle('light', !dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
